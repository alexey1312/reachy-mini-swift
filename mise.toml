# =============================================================================
# mise Configuration for ReachyMini
# =============================================================================
# Bootstrap: run ./bootstrap.sh once after cloning. No global mise needed —
# ./bin/mise is a self-contained bootstrap binary (mise generate bootstrap).
#
# To update the embedded mise version:
#   mise generate bootstrap > ./bin/mise && chmod +x ./bin/mise
# =============================================================================

[settings]
experimental = true
legacy_version_file = false

# Safety net for developers who skipped ./bootstrap.sh: wire git hooks on
# directory entry via the native core.hooksPath mechanism.
[hooks]
enter = """
git config core.hooksPath .githooks 2>/dev/null || true
"""

[tools]
# --- Swift Development ---
# Swift itself is managed by swiftly via .swift-version, not by mise.
swiftformat = "0.62.1" # Swift code formatting
swiftlint = "0.65.0"   # Swift linting
xcsift = "1.4.1"       # xcodebuild/swift output filtering
tuist = "4.203.1"      # Xcode project generation (Apps/)

# --- Documentation & Formatting ---
dprint = "0.55.2" # Markdown formatting

# --- Snapshots & Storybook ---
# The release ships a single lowercase `prefire` binary, which the backend cannot guess from the
# repository name — hence the explicit exe option.
"github:BarredEwe/Prefire[exe=prefire]" = "5.7.0"
git-lfs = "3.7.1" # Snapshot reference images

# --- Git & CI ---
hk = "1.54.0"         # Git hooks manager (version must match hk.pkl package URI)
actionlint = "1.7.12" # GitHub Actions linting
git-cliff = "2.13.1"  # Changelog generation

# --- Release ---
# The release ships a bare binary rather than an archive, and that decides the option:
# `bin` renames a single downloaded file, `exe` (used for Prefire above) only renames one
# extracted from an archive and here leaves an unrunnable `asc_<version>_macOS`.
"github:rorkai/App-Store-Connect-CLI[bin=asc]" = "3.7.0" # App Store Connect API client

# --- Simulator ---
python = "3.12" # for sim-daemon venv: mujoco ships no wheels for newer pythons
uv = "0.12.1"   # installs into that venv as APFS clones — see sim-daemon

[tasks.build]
description = "Build the Swift package (debug)"
run = """
set -o pipefail
. Scripts/swiftpm-env.sh
swift build 2>&1 | xcsift
"""

[tasks."build:release"]
description = "Build the Swift package (release)"
run = """
set -o pipefail
. Scripts/swiftpm-env.sh
swift build --configuration release 2>&1 | xcsift
"""

# `build` and `test` are SwiftPM only — Apps/ReachyMini is an Xcode target and
# nothing else compiles it. Signing is off: the runner has no team, and the
# personal one lives in CLAUDE.local.md.
[tasks."build:app"]
description = "Build the ReachyMini app target (macOS)"
depends = ["project"]
# `-resultBundlePath` is what makes build insights reach tuist.dev. Tuist writes a
# `tuist inspect build` post-action into every generated scheme, and it reads the
# .xcactivitylog that xcodebuild only writes when a result bundle is requested — Xcode.app
# writes one unconditionally, which is why local Xcode builds were the only ones ever
# recorded. Without the flag the post-action fails with "couldn't find the most recent
# activity log" and, being a post-action, leaves the build green.
#
# `REACHY_XCB_EXTRA` carries settings that belong to CI and not to a developer's machine;
# ci.yml sets it and every xcodebuild task here honours it. It exists for
# COMPILER_INDEX_STORE_ENABLE=NO: these tasks write into the same Apps/DerivedData that
# Xcode.app indexes from, so turning the index store off unconditionally would degrade
# local code completion to buy CI a few percent.
run = '''
set -o pipefail
RESULT_BUNDLE=Apps/DerivedData/ResultBundles/ReachyMini-macOS.xcresult
rm -rf "$RESULT_BUNDLE"
xcodebuild -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyMini \
  -destination 'platform=macOS' -configuration Debug \
  -derivedDataPath Apps/DerivedData \
  -resultBundlePath "$RESULT_BUNDLE" \
  CODE_SIGNING_ALLOWED=NO \
  -skipPackagePluginValidation -skipMacroValidation \
  ${REACHY_XCB_EXTRA:-} \
  build 2>&1 | xcsift
'''

# The macOS build above compiles ReachyWidget too, but only the half the Mac can
# run: the extension is embedded unconditionally now, and the nine Control Centre
# controls stay `#if os(iOS)`. `generic/platform=iOS` is what compiles them,
# without needing a device, a simulator or a signing identity.
[tasks."build:app:ios"]
description = "Build the ReachyMini app and its widget extension (iOS, unsigned)"
depends = ["project"]
run = '''
set -o pipefail
RESULT_BUNDLE=Apps/DerivedData/ResultBundles/ReachyMini-iOS.xcresult
rm -rf "$RESULT_BUNDLE"
xcodebuild -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyMini \
  -destination 'generic/platform=iOS' -configuration Debug \
  -derivedDataPath Apps/DerivedData \
  -resultBundlePath "$RESULT_BUNDLE" \
  CODE_SIGNING_ALLOWED=NO \
  -skipPackagePluginValidation -skipMacroValidation \
  ${REACHY_XCB_EXTRA:-} \
  build 2>&1 | xcsift
'''

# Release builds exist to guard archive-ability: nothing else compiles the
# Release configuration, so a broken one would first surface at archive time.
# Each ends by asserting the built app carries its App Intents metadata —
# extraction failing is a warning, never a build error, and an app that ships
# without it shows no actions in the Shortcuts app (TestFlight 0.1.1 did).
#
# Both override Release defaults, because these tasks compile rather than ship.
# `ONLY_ACTIVE_ARCH=NO` is Xcode's Release default and made the macOS build compile
# arm64 and x86_64 in sequence — 8.5 minutes on CI against Debug's 3.0, for a second
# target triple that has never caught anything the first did not (WebRTC's macOS
# slice is `macos-x86_64_arm64`, so even the link is covered). It is macOS-only:
# a generic iOS destination is arm64 either way. `dwarf` drops the dsymutil pass from
# both. The shipped artifact is unaffected — Scripts/release-macos.sh and
# release-ios.sh archive with the defaults and stay universal, with dSYMs.
[tasks."build:app:release"]
description = "Build the ReachyMini app target (macOS, Release, unsigned)"
depends = ["project"]
run = '''
set -o pipefail
RESULT_BUNDLE=Apps/DerivedData/ResultBundles/ReachyMini-macOS-release.xcresult
rm -rf "$RESULT_BUNDLE"
xcodebuild -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyMini \
  -destination 'platform=macOS' -configuration Release \
  -derivedDataPath Apps/DerivedData \
  -resultBundlePath "$RESULT_BUNDLE" \
  CODE_SIGNING_ALLOWED=NO \
  ONLY_ACTIVE_ARCH=YES DEBUG_INFORMATION_FORMAT=dwarf \
  -skipPackagePluginValidation -skipMacroValidation \
  ${REACHY_XCB_EXTRA:-} \
  build 2>&1 | xcsift
Scripts/check-appintents-metadata.sh Apps/DerivedData/Build/Products/Release/ReachyMini.app
'''

[tasks."build:app:ios:release"]
description = "Build the ReachyMini app and widget (iOS, Release, unsigned)"
depends = ["project"]
run = '''
set -o pipefail
RESULT_BUNDLE=Apps/DerivedData/ResultBundles/ReachyMini-iOS-release.xcresult
rm -rf "$RESULT_BUNDLE"
xcodebuild -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyMini \
  -destination 'generic/platform=iOS' -configuration Release \
  -derivedDataPath Apps/DerivedData \
  -resultBundlePath "$RESULT_BUNDLE" \
  CODE_SIGNING_ALLOWED=NO \
  DEBUG_INFORMATION_FORMAT=dwarf \
  -skipPackagePluginValidation -skipMacroValidation \
  ${REACHY_XCB_EXTRA:-} \
  build 2>&1 | xcsift
Scripts/check-appintents-metadata.sh Apps/DerivedData/Build/Products/Release-iphoneos/ReachyMini.app
'''

[tasks.device]
description = "Build, install and launch on a connected iPhone (see Scripts/device-run.sh)"
depends = ["project"]
run = "./Scripts/device-run.sh"

[tasks.asc]
description = "App Store Connect CLI with the release credentials loaded (usage: mise run asc -- builds list --app <id>)"
run = "./Scripts/asc.sh"

[tasks."release:ios"]
description = "Archive the iOS app and upload it to TestFlight (see Scripts/release-ios.sh)"
depends = ["project"]
run = "./Scripts/release-ios.sh"

[tasks."release:macos"]
description = "Archive, notarize and zip the macOS app (see Scripts/release-macos.sh)"
depends = ["project"]
run = "./Scripts/release-macos.sh"

[tasks.test]
description = "Run all tests (parallel)"
# --skip-build against a separate build step: building and testing at once hangs.
run = """
set -o pipefail
. Scripts/swiftpm-env.sh
swift build --build-tests 2>&1 | xcsift
swift test --skip-build --parallel 2>&1 | xcsift
"""

[tasks."test:filter"]
description = "Run tests with filter (usage: mise run test:filter ReachyKitTests)"
run = """
set -o pipefail
. Scripts/swiftpm-env.sh
swift test --parallel --filter {{arg(name='filter')}} 2>&1 | xcsift
"""

# Smoke tests boot the actual app binary on a simulator — the one wiring nothing
# else exercises. No OS pin: unlike the snapshot suite these assert on structure,
# not pixels, so whatever runtime the machine has is fine. Labels are matched in
# English, hence the pinned test language (the snapshot suite's trade).
[tasks."test:smoke"]
description = "Launch the app on a simulator and smoke the connect gate (XCUITest)"
depends = ["project"]
run = '''
set -o pipefail
SIM="${REACHY_SMOKE_SIM:-iPhone 17 Pro}"
xcrun simctl boot "$SIM" 2>/dev/null || true
xcodebuild test -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyMini \
  -destination "platform=iOS Simulator,name=${SIM}" \
  -derivedDataPath Apps/DerivedData \
  -testLanguage en -testRegion US \
  CODE_SIGNING_ALLOWED=NO \
  -skipPackagePluginValidation -skipMacroValidation \
  ${REACHY_XCB_EXTRA:-} \
  2>&1 | xcsift
'''

[tasks."test:smoke:sim"]
description = "Smoke the whole user path against a running sim daemon (start with: mise run sim-daemon)"
depends = ["project"]
run = '''
set -o pipefail
SIM="${REACHY_SMOKE_SIM:-iPhone 17 Pro}"
xcrun simctl boot "$SIM" 2>/dev/null || true
# TEST_RUNNER_ forwards the variable into the XCUITest runner's environment.
xcodebuild test -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyMini \
  -destination "platform=iOS Simulator,name=${SIM}" \
  -derivedDataPath Apps/DerivedData \
  -testLanguage en -testRegion US \
  CODE_SIGNING_ALLOWED=NO \
  TEST_RUNNER_REACHY_SMOKE_HOST="${REACHY_SMOKE_HOST:-127.0.0.1:8000}" \
  -skipPackagePluginValidation -skipMacroValidation \
  2>&1 | xcsift
'''

[tasks."test:sim"]
description = "Integration tests against a running sim daemon (start with: mise run sim-daemon)"
run = """
set -o pipefail
. Scripts/swiftpm-env.sh
REACHY_SIM_HOST=127.0.0.1 swift test --parallel --filter SimulatorIntegrationTests 2>&1 | xcsift
"""

# Snapshots run on an iOS simulator, so they live in Apps/ as an Xcode target and never reach
# `swift test`. Both the device and the OS are pinned: a different runtime renders text
# differently and every reference would have to be re-recorded.
[tasks."snapshots:_run"]
hide = true
depends = ["project"]
run = '''
set -o pipefail
SIM="${REACHY_SNAPSHOT_SIM:-iPhone 17 Pro}"
# Belt and braces since the forked template took over: each preview is captured in both
# appearances from an injected trait, and the surfaces gallery re-recorded on a *dark* simulator
# came out byte-identical, so the trait decides. Left here for whatever the trait does not reach.
xcrun simctl boot "$SIM" 2>/dev/null || true
xcrun simctl ui "$SIM" appearance light >/dev/null 2>&1 || true
# References are English-only on purpose. Every string this app shows is localizable, and a
# simulator left in another language would re-render all 1000 of them in it.
xcodebuild test -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyUISnapshotTests \
  -destination "platform=iOS Simulator,name=${SIM},OS=${REACHY_SNAPSHOT_OS:-27.0}" \
  -derivedDataPath Apps/DerivedData \
  -testLanguage en -testRegion US \
  CODE_SIGNING_ALLOWED=NO \
  -skipPackagePluginValidation -skipMacroValidation \
  2>&1 | xcsift
'''

# Previews compile only in the Xcode targets (`Package.swift` excludes `Previews/**`),
# so `swift build` cannot vet them and a broken preview otherwise first surfaces
# minutes into a local snapshot run — or after `record` has deleted every reference.
# build-for-testing against a generic destination compiles the previews, the Prefire
# generation and the snapshot target without needing a simulator runtime or comparing
# a single reference, which is what lets CI run it on any Xcode image.
[tasks."snapshots:build"]
description = "Compile the snapshot target without running it (CI's whole preview coverage)"
depends = ["project"]
run = """
set -o pipefail
xcodebuild build-for-testing -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyUISnapshotTests \
  -destination 'generic/platform=iOS Simulator' \
  -derivedDataPath Apps/DerivedData \
  CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation \
  ${REACHY_XCB_EXTRA:-} \
  2>&1 | xcsift
"""

[tasks."test:snapshots"]
description = "Snapshot-test every ReachyUI preview (fails if a reference had to be recorded)"
run = '''
#!/bin/bash
set -euo pipefail
DIR=Apps/ReachyUISnapshotTests/__Snapshots__
# Prefire generates `record: .missing`, so an absent reference is written rather than compared.
# Comparing the images either side of the run reports that as a failure even if the suite itself
# is happy — a reference that had to be written verified nothing. Checksums rather than
# `git status`, so an uncommitted tree does not read as a failure.
fingerprint() { find "$DIR" -name '*.png' -exec shasum -a 256 {} + 2>/dev/null | sort; }
BEFORE="$(fingerprint)"
./bin/mise run snapshots:_run
AFTER="$(fingerprint)"
if [ "$BEFORE" != "$AFTER" ]; then
  echo "Snapshot references were written during the run, so they verified nothing:" >&2
  diff <(echo "$BEFORE") <(echo "$AFTER") >&2 || true
  echo "Review the images, or re-record them all with: mise run test:snapshots:record" >&2
  exit 1
fi
'''

[tasks."test:snapshots:record"]
description = "Delete and re-record every snapshot reference, leaving the diff for review"
run = '''
#!/bin/bash
set -euo pipefail
DIR=Apps/ReachyUISnapshotTests/__Snapshots__
# `record: .missing` only writes absent references, so re-recording means removing them first.
[ -d "$DIR" ] && find "$DIR" -name '*.png' -delete
# swift-snapshot-testing reports a freshly recorded reference as a test failure, which is the
# expected outcome here — the point of this task is to write them.
./bin/mise run snapshots:_run || true
git status --short -- "$DIR"
'''

[tasks.storybook]
description = "Regenerate the preview catalogue and run the storybook app on a simulator"
run = '''
#!/bin/bash
set -euo pipefail
SIM="${REACHY_SNAPSHOT_SIM:-iPhone 17 Pro}"
# The playbook plugin only ever scans its own target's sources, so the CLI is driven directly.
prefire playbook Sources/ReachyDesign/Previews Sources/ReachyUI/Previews Sources/ReachyWidgetUI/Previews \
  Apps/ReachyMini/Previews \
  --output Apps/ReachyStorybook/Generated \
  --config Apps
./bin/mise run project
set -o pipefail
xcodebuild -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyStorybook \
  -destination "platform=iOS Simulator,name=$SIM,OS=${REACHY_SNAPSHOT_OS:-27.0}" \
  -configuration Debug -derivedDataPath Apps/DerivedData \
  CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation \
  build 2>&1 | xcsift
xcrun simctl boot "$SIM" 2>/dev/null || true
open -a Simulator
xcrun simctl install "$SIM" Apps/DerivedData/Build/Products/Debug-iphonesimulator/ReachyStorybook.app
xcrun simctl launch "$SIM" com.alexey1312.ReachyMiniStorybook
'''

[tasks.lint]
description = "Run SwiftLint, actionlint, the catalogue check, and the version lockstep checks"
# The shebang is not decoration: mise runs an inline task with `sh -c`, which on macOS is
# bash and on Linux is dash — where the next line fails outright with
# `set: Illegal option -o pipefail`. Naming bash is also the only way to fix that from a
# committed config, since mise ignores `unix_default_inline_shell_args` outside the
# global one ("ignored for security reasons") and warns on every invocation about it.
run = '''
#!/bin/bash
set -o pipefail
# On Linux this is what puts libsourcekitdInProc.so on the loader's path; on macOS it
# does nothing. Without it swiftlint below dies before reading a rule, which is how a
# `--strict` warning stayed unfindable off a Mac until CI named it.
. Scripts/sourcekit-env.sh
# Rule 9 routes every user-facing string through `.reachy(_:)`, and nothing checked
# that the key it names is in the catalogue — a missing key renders the English key
# perfectly, for ever, so 139 of them accumulated unnoticed. Runs first because it
# needs neither a toolchain nor a network.
python3 Scripts/check-catalogue.py
PINNED="$(sed -nE 's/^hk = "([0-9.]+)".*/\1/p' mise.toml)"
DRIFT="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' hk.pkl | sort -u | grep -vFx "$PINNED" || true)"
if [ -n "$DRIFT" ]; then
  echo "hk.pkl references $DRIFT but mise.toml pins $PINNED — bump both together." >&2
  exit 1
fi
# The forked PreviewTests.stencil is only valid against one Prefire, which is why the
# package requirement is .exact — the CLI in [tools] has to move in lockstep with it.
PREFIRE_CLI="$(sed -nE 's|^"github:BarredEwe/Prefire\[exe=prefire\]" = "([0-9.]+)".*|\1|p' mise.toml)"
PREFIRE_PKG="$(sed -nE 's|.*BarredEwe/Prefire", requirement: \.exact\("([0-9.]+)"\).*|\1|p' Apps/Project.swift)"
if [ -z "$PREFIRE_CLI" ] || [ "$PREFIRE_CLI" != "$PREFIRE_PKG" ]; then
  echo "mise.toml pins prefire '$PREFIRE_CLI' but Apps/Project.swift pins '$PREFIRE_PKG' — bump both together." >&2
  exit 1
fi
# xcodebuild resolves the whole Tuist workspace into Package.resolved; a plain
# swift build/test strips those pins again and a merge can drop them silently.
# The committed file is what has to carry them (the working tree legitimately
# oscillates), so the check reads HEAD.
for PIN in prefire swift-snapshot-testing; do
  if ! git show HEAD:Package.resolved | grep -q "\"$PIN\""; then
    echo "Package.resolved at HEAD lost the Xcode-workspace pin '$PIN' — run 'mise run project' (or any snapshot task) last and commit the 25-pin version." >&2
    exit 1
  fi
done
PATHS="Sources Tests Apps/ReachyMini Apps/ReachyMiniUITests Apps/ReachyStorybook Apps/ReachyUISnapshotTests Apps/ReachyWidget"
# xcsift is an Xcode-output filter and ships for macOS only, so a Linux checkout has
# swiftlint but not the pipe to read it through. Raw output is no loss here — AGENTS.md
# already says to rerun the tool directly when xcsift truncates a long run.
if command -v xcsift >/dev/null 2>&1; then
  swiftlint lint --strict $PATHS 2>&1 | xcsift
else
  # --quiet drops the per-file progress xcsift would have swallowed, and nothing else:
  # violations still print, which is the whole point of the branch.
  swiftlint lint --strict --quiet $PATHS
fi
actionlint
'''

[tasks.format]
description = "Format all files (Swift + Markdown)"
run = """
. Scripts/sourcekit-env.sh
hk fix --all 2>&1 | grep -E '^(✔|✗|hk )' || true
"""

[tasks.format-check]
description = "Check all formatting (CI)"
# The filter keeps a passing run to one line per step, and it used to be applied
# unconditionally — which also stripped the violations. A failed `swiftlint-strict`
# reached CI as `✗ swiftlint-strict [====>] 2/3` and nothing else: no file, no line,
# no rule, and nothing in the run's other four jobs to read instead. hk *does* print
# the tool's own output (it repeats it under `<step> stderr:` at the end), so the fix
# is to stop filtering the moment there is something to read.
run = """
# hk's own children inherit this, which is what makes its swiftlint steps work on a
# Linux checkout — see Scripts/sourcekit-env.sh.
. Scripts/sourcekit-env.sh
LOG="$(mktemp)"
if hk check --all >"$LOG" 2>&1; then
  grep -E '^(✔|✗|hk )' "$LOG" || true
else
  cat "$LOG"
  exit 1
fi
"""

[tasks.setup]
description = "Show git hooks status"
run = "echo 'Git hooks:' && git config core.hooksPath && ls .githooks/"

[tasks.project]
description = "Generate Xcode project for app targets (Apps/)"
# Explicit path: /usr/local/bin/tuist (tuistenv) can shadow mise's pinned tuist.
# TOOLCHAINS is cleared because tuist 4.203.1 reads only Xcode's version banner
# ("swift-driver version: … Apple Swift version …") and aborts on a swift.org
# toolchain's ("Apple Swift version 6.3 (swift-6.3-RELEASE)").
run = """
#!/bin/bash
set -euo pipefail
# The storybook target globs `Generated/**`, which is gitignored — tuist rejects a glob whose
# directory does not exist, so generation fails outright on a fresh clone (and in CI) unless the
# playbook is written first. Cheap enough to redo every time.
prefire playbook Sources/ReachyDesign/Previews Sources/ReachyUI/Previews Sources/ReachyWidgetUI/Previews \
  Apps/ReachyMini/Previews \
  --output Apps/ReachyStorybook/Generated --config Apps
TUIST="$(./bin/mise where tuist)/tuist"
cd Apps && exec env -u TOOLCHAINS "$TUIST" generate --no-open
"""

[tasks."inspect:bundle"]
description = "Upload an iOS app-bundle size analysis to tuist.dev"
# Runs from Apps/ because tuist only searches upward for Tuist.swift; from the repo
# root it reports the project as unconnected instead of naming the wrong cwd.
run = '''
#!/bin/bash
set -euo pipefail
BUNDLE="{{arg(name='bundle', default='Apps/DerivedData/Build/Products/Debug-iphoneos/ReachyMini.app')}}"
if [ ! -e "$BUNDLE" ]; then
  echo "No bundle at $BUNDLE — build for a device first (see CLAUDE.local.md)." >&2
  exit 1
fi
BUNDLE="$(cd "$(dirname "$BUNDLE")" && pwd)/$(basename "$BUNDLE")"
if [ ! -f "$BUNDLE/Info.plist" ] && [ -f "$BUNDLE/Contents/Info.plist" ]; then
  echo "$BUNDLE is a macOS bundle; this command takes the iOS one (Debug-iphoneos)." >&2
  exit 1
fi
TUIST="$(./bin/mise where tuist)/tuist"
cd Apps && exec "$TUIST" inspect bundle "$BUNDLE"
'''

[tasks.share]
description = "Upload a built app to tuist.dev Previews and print the share link"
# The Debug-iphoneos default is the `mise run device` product: signed with the personal
# team, so the preview installs on registered devices — the unsigned CI build would not.
run = '''
#!/bin/bash
set -euo pipefail
BUNDLE="{{arg(name='bundle', default='Apps/DerivedData/Build/Products/Debug-iphoneos/ReachyMini.app')}}"
if [ ! -e "$BUNDLE" ]; then
  echo "No bundle at $BUNDLE — run 'mise run device -- --build-only' first." >&2
  exit 1
fi
BUNDLE="$(cd "$(dirname "$BUNDLE")" && pwd)/$(basename "$BUNDLE")"
TUIST="$(./bin/mise where tuist)/tuist"
cd Apps && exec env -u TOOLCHAINS "$TUIST" share "$BUNDLE"
'''

[tasks.clean]
description = "Clean build artifacts"
run = "swift package clean && rm -rf .build"

[tasks.changelog]
description = "Generate CHANGELOG.md from git history"
run = "git-cliff -o CHANGELOG.md"

[tasks.update-spec]
description = "Fetch latest daemon OpenAPI spec from pollen-robotics/reachy_mini"
run = """
curl -fsSL https://raw.githubusercontent.com/pollen-robotics/reachy_mini/main/docs/source/API/openapi.json \
  -o Sources/ReachyKit/openapi.json
python3 Scripts/normalize-openapi.py Sources/ReachyKit/openapi.json
git diff --stat Sources/ReachyKit/openapi.json
"""

[tasks."theme:colors"]
description = "Regenerate Theme*.colorset from ReachyTheme.palette"
run = """
set -o pipefail
swift Scripts/render-theme-colors.swift
git diff --stat Sources/ReachyDesign/Resources
"""

[tasks."theme:icons"]
description = "Regenerate the six AppIcon*.icon bundles from the palette"
run = """
set -o pipefail
swift Scripts/render-app-icon.swift
git status --porcelain Apps/ReachyMini/Resources
"""

[tasks.sim-daemon]
description = "Run simulated Reachy Mini daemon (MuJoCo) reachable from LAN devices"
run = """
#!/bin/bash
set -euo pipefail
# The venv is created by `python -m venv` (MuJoCo's GUI needs mjpython, which wants a
# real framework build) and only *filled* by uv. uv writes each file as an APFS clone
# instead of copying it out of its cache, so a second worktree costs ~6 MiB and under a
# second rather than 1.3 GB and ten minutes. Measured with the daemon then serving
# /api/daemon/status — `uv venv` itself is what was never tried against mujoco.
VENV=.venv-sim
REQUIREMENTS=Scripts/sim-requirements.txt
STAMP="$VENV/.requirements.sha256"
EXPECTED="$(shasum -a 256 "$REQUIREMENTS" | awk '{print $1}')"
# Explicit path: system PATH can shadow mise's python with an ancient one.
PYTHON="$(./bin/mise where python)/bin/python3"
INSTALLED="$(test -f "$STAMP" && cat "$STAMP" || true)"
if [ ! -x "$VENV/bin/mjpython" ] || [ "$INSTALLED" != "$EXPECTED" ]; then
  rm -rf "$VENV"
  "$PYTHON" -m venv "$VENV"
  uv pip install --quiet --python "$VENV/bin/python" --requirement "$REQUIREMENTS"
  printf '%s' "$EXPECTED" > "$STAMP"
fi
"$VENV/bin/python" -c 'import importlib.metadata as m; assert m.version("reachy-mini") == "1.9.0"'
# `gstreamer_python`'s libgstpython.dylib segfaults while GStreamer scans plugins.
# Forked (the default) that only surfaces as "External plugin loader failed" and
# the daemon then hangs before binding :8000; with GST_REGISTRY_FORK=no the
# segfault kills the daemon outright. The pipeline below needs native elements
# only, so the plugin is pure liability.
find "$VENV" -name libgstpython.dylib -exec mv {} {}.disabled ';' 2>/dev/null || true
# Without the scanner GStreamer's plugin loader silently fails, webrtcsink can't
# find the Opus encoder ("No caps found for stream audio_0") and no WebRTC
# producer is ever registered on :8443.
export GST_PLUGIN_SCANNER="$PWD/$VENV/lib/python3.12/site-packages/gstreamer_libs/libexec/gstreamer-1.0/gst-plugin-scanner"
exec "$VENV/bin/mjpython" -m reachy_mini.daemon.app.main --sim --fastapi-host 0.0.0.0 "$@"
"""
