# =============================================================================
# mise Configuration for ReachyMini
# =============================================================================
# Bootstrap: run ./bootstrap.sh once after cloning. No global mise needed —
# ./bin/mise is a self-contained bootstrap binary (mise generate bootstrap).
#
# To update the embedded mise version:
#   mise generate bootstrap > ./bin/mise && chmod +x ./bin/mise
# =============================================================================

[settings]
experimental = true
legacy_version_file = false

# Safety net for developers who skipped ./bootstrap.sh: wire git hooks on
# directory entry via the native core.hooksPath mechanism.
[hooks]
enter = """
git config core.hooksPath .githooks 2>/dev/null || true
"""

[tools]
# --- Swift Development ---
# Swift itself is managed by swiftly via .swift-version, not by mise.
swiftformat = "0.62.1" # Swift code formatting
swiftlint = "0.65.0"   # Swift linting
xcsift = "1.3.1"       # xcodebuild/swift output filtering
tuist = "4.203.1"      # Xcode project generation (Apps/)

# --- Documentation & Formatting ---
dprint = "0.55.2" # Markdown formatting

# --- Snapshots & Storybook ---
# The release ships a single lowercase `prefire` binary, which the backend cannot guess from the
# repository name — hence the explicit exe option.
"github:BarredEwe/Prefire[exe=prefire]" = "5.7.0"
git-lfs = "3.7.1" # Snapshot reference images

# --- Git & CI ---
hk = "1.54.0"         # Git hooks manager (version must match hk.pkl package URI)
actionlint = "1.7.12" # GitHub Actions linting
git-cliff = "2.13.1"  # Changelog generation

# --- Simulator ---
python = "3.12" # for sim-daemon venv: mujoco ships no wheels for newer pythons
uv = "0.12.1"   # installs into that venv as APFS clones — see sim-daemon

[tasks.build]
description = "Build the Swift package (debug)"
run = """
set -o pipefail
swift build 2>&1 | xcsift
"""

[tasks."build:release"]
description = "Build the Swift package (release)"
run = """
set -o pipefail
swift build --configuration release 2>&1 | xcsift
"""

# `build` and `test` are SwiftPM only — Apps/ReachyMini is an Xcode target and
# nothing else compiles it. Signing is off: the runner has no team, and the
# personal one lives in CLAUDE.local.md.
[tasks."build:app"]
description = "Build the ReachyMini app target (macOS)"
depends = ["project"]
run = '''
set -o pipefail
xcodebuild -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyMini \
  -destination 'platform=macOS' -configuration Debug \
  -derivedDataPath Apps/DerivedData \
  CODE_SIGNING_ALLOWED=NO \
  -skipPackagePluginValidation -skipMacroValidation \
  build 2>&1 | xcsift
'''

# The macOS build above cannot see ReachyWidget: the extension is iOS-only and
# Project.swift embeds it with `condition: .when([.ios])`, so under `platform=macOS`
# it is not built at all. `generic/platform=iOS` compiles it without needing a
# device, a simulator or a signing identity.
[tasks."build:app:ios"]
description = "Build the ReachyMini app and its widget extension (iOS, unsigned)"
depends = ["project"]
run = '''
set -o pipefail
xcodebuild -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyMini \
  -destination 'generic/platform=iOS' -configuration Debug \
  -derivedDataPath Apps/DerivedData \
  CODE_SIGNING_ALLOWED=NO \
  -skipPackagePluginValidation -skipMacroValidation \
  build 2>&1 | xcsift
'''

# Release builds exist to guard archive-ability: nothing else compiles the
# Release configuration, so a broken one would first surface at archive time.
[tasks."build:app:release"]
description = "Build the ReachyMini app target (macOS, Release, unsigned)"
depends = ["project"]
run = '''
set -o pipefail
xcodebuild -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyMini \
  -destination 'platform=macOS' -configuration Release \
  -derivedDataPath Apps/DerivedData \
  CODE_SIGNING_ALLOWED=NO \
  -skipPackagePluginValidation -skipMacroValidation \
  build 2>&1 | xcsift
'''

[tasks."build:app:ios:release"]
description = "Build the ReachyMini app and widget (iOS, Release, unsigned)"
depends = ["project"]
run = '''
set -o pipefail
xcodebuild -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyMini \
  -destination 'generic/platform=iOS' -configuration Release \
  -derivedDataPath Apps/DerivedData \
  CODE_SIGNING_ALLOWED=NO \
  -skipPackagePluginValidation -skipMacroValidation \
  build 2>&1 | xcsift
'''

[tasks.device]
description = "Build, install and launch on a connected iPhone (see Scripts/device-run.sh)"
depends = ["project"]
run = "./Scripts/device-run.sh"

[tasks.test]
description = "Run all tests (parallel)"
# --skip-build against a separate build step: building and testing at once hangs.
run = """
set -o pipefail
swift build --build-tests 2>&1 | xcsift
swift test --skip-build --parallel 2>&1 | xcsift
"""

[tasks."test:filter"]
description = "Run tests with filter (usage: mise run test:filter ReachyKitTests)"
run = """
set -o pipefail
swift test --parallel --filter {{arg(name='filter')}} 2>&1 | xcsift
"""

[tasks."test:sim"]
description = "Integration tests against a running sim daemon (start with: mise run sim-daemon)"
run = """
set -o pipefail
REACHY_SIM_HOST=127.0.0.1 swift test --parallel --filter SimulatorIntegrationTests 2>&1 | xcsift
"""

# Snapshots run on an iOS simulator, so they live in Apps/ as an Xcode target and never reach
# `swift test`. Both the device and the OS are pinned: a different runtime renders text
# differently and every reference would have to be re-recorded.
[tasks."snapshots:_run"]
hide = true
depends = ["project"]
run = '''
set -o pipefail
SIM="${REACHY_SNAPSHOT_SIM:-iPhone 17 Pro}"
# Belt and braces since the forked template took over: each preview is captured in both
# appearances from an injected trait, and the surfaces gallery re-recorded on a *dark* simulator
# came out byte-identical, so the trait decides. Left here for whatever the trait does not reach.
xcrun simctl boot "$SIM" 2>/dev/null || true
xcrun simctl ui "$SIM" appearance light >/dev/null 2>&1 || true
# References are English-only on purpose. Every string this app shows is localizable, and a
# simulator left in another language would re-render all 1000 of them in it.
xcodebuild test -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyUISnapshotTests \
  -destination "platform=iOS Simulator,name=${SIM},OS=${REACHY_SNAPSHOT_OS:-26.4.1}" \
  -derivedDataPath Apps/DerivedData \
  -testLanguage en -testRegion US \
  CODE_SIGNING_ALLOWED=NO \
  -skipPackagePluginValidation -skipMacroValidation \
  2>&1 | xcsift
'''

[tasks."test:snapshots"]
description = "Snapshot-test every ReachyUI preview (fails if a reference had to be recorded)"
run = '''
#!/bin/bash
set -euo pipefail
DIR=Apps/ReachyUISnapshotTests/__Snapshots__
# Prefire generates `record: .missing`, so an absent reference is written rather than compared.
# Comparing the images either side of the run reports that as a failure even if the suite itself
# is happy — a reference that had to be written verified nothing. Checksums rather than
# `git status`, so an uncommitted tree does not read as a failure.
fingerprint() { find "$DIR" -name '*.png' -exec shasum -a 256 {} + 2>/dev/null | sort; }
BEFORE="$(fingerprint)"
./bin/mise run snapshots:_run
AFTER="$(fingerprint)"
if [ "$BEFORE" != "$AFTER" ]; then
  echo "Snapshot references were written during the run, so they verified nothing:" >&2
  diff <(echo "$BEFORE") <(echo "$AFTER") >&2 || true
  echo "Review the images, or re-record them all with: mise run test:snapshots:record" >&2
  exit 1
fi
'''

[tasks."test:snapshots:record"]
description = "Delete and re-record every snapshot reference, leaving the diff for review"
run = '''
#!/bin/bash
set -euo pipefail
DIR=Apps/ReachyUISnapshotTests/__Snapshots__
# `record: .missing` only writes absent references, so re-recording means removing them first.
[ -d "$DIR" ] && find "$DIR" -name '*.png' -delete
# swift-snapshot-testing reports a freshly recorded reference as a test failure, which is the
# expected outcome here — the point of this task is to write them.
./bin/mise run snapshots:_run || true
git status --short -- "$DIR"
'''

[tasks.storybook]
description = "Regenerate the preview catalogue and run the storybook app on a simulator"
run = '''
#!/bin/bash
set -euo pipefail
SIM="${REACHY_SNAPSHOT_SIM:-iPhone 17 Pro}"
# The playbook plugin only ever scans its own target's sources, so the CLI is driven directly.
prefire playbook Sources/ReachyDesign/Previews Sources/ReachyUI/Previews Apps/ReachyMini/Previews \
  --output Apps/ReachyStorybook/Generated \
  --config Apps
./bin/mise run project
set -o pipefail
xcodebuild -workspace Apps/ReachyMiniApps.xcworkspace -scheme ReachyStorybook \
  -destination "platform=iOS Simulator,name=$SIM,OS=${REACHY_SNAPSHOT_OS:-26.4.1}" \
  -configuration Debug -derivedDataPath Apps/DerivedData \
  CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation \
  build 2>&1 | xcsift
xcrun simctl boot "$SIM" 2>/dev/null || true
open -a Simulator
xcrun simctl install "$SIM" Apps/DerivedData/Build/Products/Debug-iphonesimulator/ReachyStorybook.app
xcrun simctl launch "$SIM" com.alexey1312.ReachyMiniStorybook
'''

[tasks.lint]
description = "Run SwiftLint, actionlint, and the hk version lockstep check"
run = '''
set -o pipefail
PINNED="$(sed -nE 's/^hk = "([0-9.]+)".*/\1/p' mise.toml)"
DRIFT="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' hk.pkl | sort -u | grep -vFx "$PINNED" || true)"
if [ -n "$DRIFT" ]; then
  echo "hk.pkl references $DRIFT but mise.toml pins $PINNED — bump both together." >&2
  exit 1
fi
swiftlint lint --strict Sources Tests Apps/ReachyMini Apps/ReachyStorybook Apps/ReachyUISnapshotTests 2>&1 | xcsift
actionlint
'''

[tasks.format]
description = "Format all files (Swift + Markdown)"
run = "hk fix --all 2>&1 | grep -E '^(✔|✗|hk )' || true"

[tasks.format-check]
description = "Check all formatting (CI)"
run = """
set -o pipefail
hk check --all 2>&1 | grep -E '^(✔|✗|hk )'
"""

[tasks.setup]
description = "Show git hooks status"
run = "echo 'Git hooks:' && git config core.hooksPath && ls .githooks/"

[tasks.project]
description = "Generate Xcode project for app targets (Apps/)"
# Explicit path: /usr/local/bin/tuist (tuistenv) can shadow mise's pinned tuist.
# TOOLCHAINS is cleared because tuist 4.203.1 reads only Xcode's version banner
# ("swift-driver version: … Apple Swift version …") and aborts on a swift.org
# toolchain's ("Apple Swift version 6.3 (swift-6.3-RELEASE)").
run = """
#!/bin/bash
set -euo pipefail
# The storybook target globs `Generated/**`, which is gitignored — tuist rejects a glob whose
# directory does not exist, so generation fails outright on a fresh clone (and in CI) unless the
# playbook is written first. Cheap enough to redo every time.
prefire playbook Sources/ReachyDesign/Previews Sources/ReachyUI/Previews Apps/ReachyMini/Previews \
  --output Apps/ReachyStorybook/Generated --config Apps
TUIST="$(./bin/mise where tuist)/tuist"
cd Apps && exec env -u TOOLCHAINS "$TUIST" generate --no-open
"""

[tasks."inspect:bundle"]
description = "Upload an iOS app-bundle size analysis to tuist.dev"
# Runs from Apps/ because tuist only searches upward for Tuist.swift; from the repo
# root it reports the project as unconnected instead of naming the wrong cwd.
run = '''
#!/bin/bash
set -euo pipefail
BUNDLE="{{arg(name='bundle', default='Apps/DerivedData/Build/Products/Debug-iphoneos/ReachyMini.app')}}"
if [ ! -e "$BUNDLE" ]; then
  echo "No bundle at $BUNDLE — build for a device first (see CLAUDE.local.md)." >&2
  exit 1
fi
BUNDLE="$(cd "$(dirname "$BUNDLE")" && pwd)/$(basename "$BUNDLE")"
if [ ! -f "$BUNDLE/Info.plist" ] && [ -f "$BUNDLE/Contents/Info.plist" ]; then
  echo "$BUNDLE is a macOS bundle; this command takes the iOS one (Debug-iphoneos)." >&2
  exit 1
fi
TUIST="$(./bin/mise where tuist)/tuist"
cd Apps && exec "$TUIST" inspect bundle "$BUNDLE"
'''

[tasks.clean]
description = "Clean build artifacts"
run = "swift package clean && rm -rf .build"

[tasks.changelog]
description = "Generate CHANGELOG.md from git history"
run = "git-cliff -o CHANGELOG.md"

[tasks.update-spec]
description = "Fetch latest daemon OpenAPI spec from pollen-robotics/reachy_mini"
run = """
curl -fsSL https://raw.githubusercontent.com/pollen-robotics/reachy_mini/main/docs/source/API/openapi.json \
  -o Sources/ReachyKit/openapi.json
python3 Scripts/normalize-openapi.py Sources/ReachyKit/openapi.json
git diff --stat Sources/ReachyKit/openapi.json
"""

[tasks.sim-daemon]
description = "Run simulated Reachy Mini daemon (MuJoCo) reachable from LAN devices"
run = """
#!/bin/bash
set -euo pipefail
# The venv is created by `python -m venv` (MuJoCo's GUI needs mjpython, which wants a
# real framework build) and only *filled* by uv. uv writes each file as an APFS clone
# instead of copying it out of its cache, so a second worktree costs ~6 MiB and under a
# second rather than 1.3 GB and ten minutes. Measured with the daemon then serving
# /api/daemon/status — `uv venv` itself is what was never tried against mujoco.
VENV=.venv-sim
REQUIREMENTS=Scripts/sim-requirements.txt
STAMP="$VENV/.requirements.sha256"
EXPECTED="$(shasum -a 256 "$REQUIREMENTS" | awk '{print $1}')"
# Explicit path: system PATH can shadow mise's python with an ancient one.
PYTHON="$(./bin/mise where python)/bin/python3"
INSTALLED="$(test -f "$STAMP" && cat "$STAMP" || true)"
if [ ! -x "$VENV/bin/mjpython" ] || [ "$INSTALLED" != "$EXPECTED" ]; then
  rm -rf "$VENV"
  "$PYTHON" -m venv "$VENV"
  uv pip install --quiet --python "$VENV/bin/python" --requirement "$REQUIREMENTS"
  printf '%s' "$EXPECTED" > "$STAMP"
fi
"$VENV/bin/python" -c 'import importlib.metadata as m; assert m.version("reachy-mini") == "1.9.0"'
# `gstreamer_python`'s libgstpython.dylib segfaults while GStreamer scans plugins.
# Forked (the default) that only surfaces as "External plugin loader failed" and
# the daemon then hangs before binding :8000; with GST_REGISTRY_FORK=no the
# segfault kills the daemon outright. The pipeline below needs native elements
# only, so the plugin is pure liability.
find "$VENV" -name libgstpython.dylib -exec mv {} {}.disabled ';' 2>/dev/null || true
# Without the scanner GStreamer's plugin loader silently fails, webrtcsink can't
# find the Opus encoder ("No caps found for stream audio_0") and no WebRTC
# producer is ever registered on :8443.
export GST_PLUGIN_SCANNER="$PWD/$VENV/lib/python3.12/site-packages/gstreamer_libs/libexec/gstreamer-1.0/gst-plugin-scanner"
exec "$VENV/bin/mjpython" -m reachy_mini.daemon.app.main --sim --fastapi-host 0.0.0.0 "$@"
"""
