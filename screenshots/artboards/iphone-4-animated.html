<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1242">
<title>Hey Reachy stickers — in motion</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1242px;height:2688px;overflow:hidden;background:#F1F3F6;}
  body{
    font-family:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;color:#14181F;
  }
  img{display:block;}
  .board{position:relative;width:1242px;height:2688px;overflow:hidden;background:#F1F3F6;}

  .head{position:absolute;top:216px;left:96px;width:1050px;}
  h1{font-size:90px;font-weight:700;letter-spacing:-.025em;line-height:1.08;}
  .sub{font-size:51px;font-weight:400;line-height:1.42;color:#6B7686;margin-top:36px;max-width:960px;}

  .ghost{position:absolute;}
  .lead{position:absolute;filter:drop-shadow(0 12px 24px rgba(20,24,31,.18));}

  .note{position:absolute;left:96px;font-size:45px;line-height:1.35;color:#6B7686;}
  .pill{
    position:absolute;display:inline-block;background:#3E4757;color:#FFFFFF;
    font-size:33px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:18px 36px;border-radius:48px;
  }

  .foot{position:absolute;left:96px;bottom:150px;display:flex;align-items:center;gap:36px;}
  .chip{
    width:84px;height:84px;border-radius:22px;flex:none;
    background:linear-gradient(180deg,#B3BCCA 0%,#9AA6B8 17%,#3E4757 83%,#353C4A 100%);
  }
  .foot p{font-size:45px;line-height:1.35;color:#6B7686;}
</style>
</head>
<body>
<div class="board">

  <div class="head">
    <h1>None of the sixteen<br>sit still</h1>
    <p class="sub">Each character has a loop of its own.</p>
  </div>

  <!-- moving left to right -->
  <img class="ghost" src="stickers/jazzman.png" alt=""
       style="left:120px;top:1000px;width:288px;height:288px;opacity:.20;transform:rotate(-16deg);">
  <img class="ghost" src="stickers/jazzman.png" alt=""
       style="left:380px;top:930px;width:336px;height:336px;opacity:.42;transform:rotate(-8deg);">
  <img class="lead" src="stickers/jazzman.png" alt="Reachy the jazz musician, animated"
       style="left:690px;top:820px;width:456px;height:456px;">
  <div class="pill" style="left:702px;top:1320px;">All sixteen</div>

  <div class="note" style="top:1470px;">They start moving the moment they land.</div>

  <!-- moving right to left -->
  <img class="ghost" src="stickers/cowboy.png" alt=""
       style="left:834px;top:1860px;width:288px;height:288px;opacity:.20;transform:rotate(16deg);">
  <img class="ghost" src="stickers/cowboy.png" alt=""
       style="left:534px;top:1810px;width:336px;height:336px;opacity:.42;transform:rotate(8deg);">
  <img class="lead" src="stickers/cowboy.png" alt="Reachy the cowboy, animated"
       style="left:96px;top:1740px;width:456px;height:456px;">

  <div class="foot">
    <div class="chip"></div>
    <p>Sixteen loops, inside Hey Reachy.</p>
  </div>

</div>
</body>
</html>
