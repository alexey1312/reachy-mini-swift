<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=2048">
<title>Hey Reachy stickers — iPad hero</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:2048px;height:2732px;overflow:hidden;background:#F1F3F6;}
  body{
    font-family:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;color:#14181F;
  }
  img{display:block;}
  .board{position:relative;width:2048px;height:2732px;overflow:hidden;background:#F1F3F6;}

  .head{position:absolute;top:200px;left:160px;width:1140px;}
  .eyebrow{
    font-size:32px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:#7A8698;margin-bottom:28px;
  }
  h1{font-size:108px;font-weight:700;letter-spacing:-.028em;line-height:1.08;}
  .sub{font-size:56px;font-weight:400;line-height:1.40;color:#6B7686;margin-top:40px;}

  .lead{
    position:absolute;right:120px;top:200px;width:560px;height:560px;
    filter:drop-shadow(0 20px 40px rgba(20,24,31,.16));
  }

  .grid{position:absolute;left:80px;top:1060px;width:1888px;display:flex;flex-direction:column;gap:56px;}
  .row{display:flex;justify-content:center;gap:47px;}
  .row.a{margin-left:-30px;}
  .row.b{margin-left:30px;}
  .row img{width:340px;height:340px;}

  .r1{transform:rotate(-4deg);}
  .r2{transform:rotate(3deg);}
  .r3{transform:rotate(-2deg);}
  .r4{transform:rotate(5deg);}
  .r5{transform:rotate(2deg);}
  .r6{transform:rotate(-5deg);}
  .r7{transform:rotate(4deg);}
  .r8{transform:rotate(-3deg);}

  .foot{position:absolute;left:160px;top:2420px;display:flex;align-items:center;gap:32px;}
  .chip{
    width:80px;height:80px;border-radius:21px;flex:none;
    background:linear-gradient(180deg,#B3BCCA 0%,#9AA6B8 17%,#3E4757 83%,#353C4A 100%);
  }
  .foot p{font-size:44px;line-height:1.35;color:#6B7686;}
  .foot strong{color:#3E4757;font-weight:600;}
</style>
</head>
<body>
<div class="board">

  <div class="head">
    <div class="eyebrow">iMessage sticker pack</div>
    <h1>Sixteen characters,<br>one tap away</h1>
    <p class="sub">One desk robot, sixteen jobs, every one of them moving.</p>
  </div>

  <img class="lead" src="stickers/astronaut.png" alt="Reachy as an astronaut">

  <div class="grid">
    <div class="row a">
      <img class="r1" src="stickers/cowboy.png" alt="Reachy as a cowboy">
      <img class="r2" src="stickers/doctor.png" alt="Reachy as a doctor">
      <img class="r3" src="stickers/jazzman.png" alt="Reachy as a jazz musician">
      <img class="r4" src="stickers/magician.png" alt="Reachy as a magician">
      <img class="r5" src="stickers/rich.png" alt="Reachy in a top hat">
    </div>
    <div class="row b">
      <img class="r6" src="stickers/builder.png" alt="Reachy as a builder">
      <img class="r7" src="stickers/explorer.png" alt="Reachy as an explorer">
      <img class="r8" src="stickers/captain.png" alt="Reachy as a sea captain">
      <img class="r2" src="stickers/farmer.png" alt="Reachy as a farmer">
      <img class="r3" src="stickers/plumber.png" alt="Reachy as a plumber">
    </div>
    <div class="row a">
      <img class="r4" src="stickers/cooking-chief.png" alt="Reachy as a chef">
      <img class="r1" src="stickers/fisherman.png" alt="Reachy as a fisherman">
      <img class="r5" src="stickers/hacker.png" alt="Reachy as a hacker">
      <img class="r6" src="stickers/student.png" alt="Reachy as a student">
      <img class="r8" src="stickers/update-box.png" alt="Reachy in a shipping box">
    </div>
  </div>

  <div class="foot">
    <div class="chip"></div>
    <p>One pack inside <strong>Hey Reachy</strong> — sixteen animated characters.</p>
  </div>

</div>
</body>
</html>
