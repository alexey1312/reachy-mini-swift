name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_GITHUB_ATTESTATIONS: false
  # Read by Apps/Tuist.swift at generation. Off for every job by default — with the
  # COMPILATION_CACHE_* settings baked in but no cache service, each compile task
  # waits out a CAS socket deadline. The app jobs flip it on once their service is up.
  TUIST_CACHE_ENABLED: "false"
  # Honoured by every xcodebuild task in mise.toml. Index-while-building writes an index
  # nothing on a runner ever opens; it stays on locally, where Xcode.app reads it out of
  # the same Apps/DerivedData.
  REACHY_XCB_EXTRA: COMPILER_INDEX_STORE_ENABLE=NO
  # The Xcode jobs generate the workspace once, in the composite action, so the build
  # tasks must not re-run their `depends = ["project"]`.
  MISE_TASK_SKIP_DEPENDS: "true"

# A personal account gets five concurrent macOS jobs, so five is the budget this file
# spends and splitting further only buys a queue. The four heavy jobs are `pull_request`
# only: merging runs them a second time over the tree the PR already proved, and two
# runs of five jobs against five slots is what turned a 22-minute CI into 30 (measured:
# 4.7 min of queueing for the app build, 8.1 for the smoke test). A push to main is
# therefore one job — lint and the SwiftPM suite, which is what a squashed commit can
# still get wrong.
jobs:
  lint-test:
    name: Lint & Test (macOS)
    runs-on: macos-15
    env:
      DEVELOPER_DIR: "/Applications/Xcode_26.2.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          experimental: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Lint runs before the toolchain install, not after: it is the fastest signal in
      # the workflow and nothing it checks needs Swift 6.3. It no longer gates the other
      # jobs — `needs: lint` cost every one of them a serial 40 s, against a formatting
      # slip that a PR author sees within the minute anyway.
      - name: Check formatting (Swift + Markdown)
        run: mise run format-check

      - name: Lint (SwiftLint + actionlint)
        run: mise run lint

      - name: Install Swift 6.3 toolchain
        run: |
          curl -fLo swift-6.3.pkg "https://download.swift.org/swift-6.3-release/xcode/swift-6.3-RELEASE/swift-6.3-RELEASE-osx.pkg"
          sudo installer -pkg swift-6.3.pkg -target /
          TOOLCHAINS=$(plutil -extract CFBundleIdentifier raw /Library/Developer/Toolchains/swift-6.3-RELEASE.xctoolchain/Info.plist)
          echo "TOOLCHAINS=$TOOLCHAINS" >> "$GITHUB_ENV"

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: .build
          # Keyed on the workspace path: .build/workspace-state.json records the WebRTC
          # xcframework absolutely, so a cache restored elsewhere (as after the repo
          # rename) sends SwiftPM looking where the artifact is not.
          key: ${{ runner.os }}-swift-6.3-spm-${{ github.workspace }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-6.3-spm-${{ github.workspace }}-

      - name: Show Swift version
        run: swift --version

      # Through the mise task, not a copy of its commands: GitHub runs `run:` under
      # `bash -e` without pipefail, so a piped `swift build … | xcsift` reports
      # xcsift's exit 0 and a failed build lands as a green job.
      - name: Build & test
        run: mise run test

  # A cache is scoped to the ref that wrote it: one created on refs/pull/N/merge is
  # readable by that PR and nothing else, while refs/heads/main is readable by every PR.
  # The four Xcode jobs are pull_request-only, so without this job nothing would ever
  # write the SourcePackages cache on main and every PR would restore an empty one —
  # measured as 101 s of package resolution per job on the run that introduced it. All
  # this job does is the shared setup, which ends by populating the cache.
  warm-cache:
    name: Warm the SPM cache
    # On `xcode-27` with the jobs that read this cache: a package graph resolved by a
    # different Xcode does not serve them, and this is the only job that writes the
    # cache on `refs/heads/main`, the one ref every PR can restore from.
    runs-on: xcode-27
    if: github.event_name == 'push'
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      DEVELOPER_DIR: "/Applications/Xcode_27.0.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/xcode-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # `swift build` never reaches Apps/ReachyMini — it is an Xcode target, not an SPM one,
  # so nothing but SwiftLint ever looked at it. These two jobs are the only thing that
  # compiles the app shell and the Tuist manifest that generates it. They are split by
  # platform rather than by configuration: four jobs would need slots this account does
  # not have, and would resolve the package graph four times over.
  app-build-macos:
    name: App Build (macOS)
    # Every Xcode job sits on `xcode-27`, and the two-image split this comment used to
    # describe is gone with it: `macos-26` tops out at Xcode 26.6, so nothing in the
    # macos-* family reaches the iOS 27 SDK. The label is a public preview image
    # (actions/runner-images#14404) carrying Xcode 27 alone, iOS 27.0 as its only
    # simulator runtime, and `iPhone 17 Pro`. Standard rather than `-xlarge`, so the
    # five concurrent macOS slots are unchanged. `actool` compiles the macOS variant of
    # the Icon Composer `.icon` here, which is what 26.4.1 was pinned for.
    runs-on: xcode-27
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    # `id-token` is what lets the composite action authenticate over OIDC instead of a
    # stored token. Job-level permissions replace the defaults wholesale, hence the
    # explicit `contents: read` for checkout.
    permissions:
      id-token: write
      contents: read
    env:
      # The stable symlink, not the versioned path: the image's own
      # `/Applications/Xcode_27_beta_N.app` moved from beta 3 to beta 4 at one rollout
      # and moves again at the next. Deliberately Xcode's own Swift, with no swift.org
      # toolchain overlaid: xcodebuild cannot load the local package's manifest under
      # one (its clang fails to spawn the linker). These jobs exist to compile the app
      # shell and the Tuist manifest; lint-test is what holds the code to Swift 6.3.
      DEVELOPER_DIR: "/Applications/Xcode_27.0.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/xcode-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          compilation-cache: "true"

      - name: Build ReachyMini (Debug)
        run: mise run build:app

      # Release guards archive-ability: nothing else compiles this configuration,
      # so without this step a broken Release first surfaces at archive time.
      - name: Build ReachyMini (Release)
        run: mise run build:app:release

      # xcsift parses compiler diagnostics and nothing else, so a failure in the
      # asset or resource phase reaches the log as `errors: 0` next to exit 65 —
      # which says a build failed and not a word about why. Every task above writes
      # a result bundle (for the tuist post-action); this reads the issues back out
      # of it so a CI-only failure is legible without reproducing it by hand.
      - name: Report build failures
        if: failure()
        run: |
          for bundle in Apps/DerivedData/ResultBundles/*.xcresult; do
            [ -e "$bundle" ] || continue
            echo "::group::$bundle"
            xcrun xcresulttool get build-results --path "$bundle" --format json \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get("errors", []), indent=2)[:20000] or "no errors recorded")' \
              || echo "could not read $bundle"
            echo "::endgroup::"
          done

  # The macOS jobs leave ReachyWidget out entirely (iOS-only extension, embedded under
  # `condition: .when([.ios])`), so without this job the widget's sources are compiled
  # by nothing at all — which is how a `missing return` in ReachyAppsWidget.swift
  # reached main in #7.
  app-build-ios:
    name: App Build (iOS + widget)
    # Same image and Xcode as the macOS app build above, for the reason given there.
    runs-on: xcode-27
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      DEVELOPER_DIR: "/Applications/Xcode_27.0.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/xcode-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          compilation-cache: "true"

      - name: Build ReachyMini + widget (Debug)
        run: mise run build:app:ios

      - name: Build ReachyMini + widget (Release)
        run: mise run build:app:ios:release

      # Same reason as the macOS job: xcsift reads compiler diagnostics only, so an
      # asset-phase failure arrives as `errors: 0` beside exit 65.
      - name: Report build failures
        if: failure()
        run: |
          for bundle in Apps/DerivedData/ResultBundles/*.xcresult; do
            [ -e "$bundle" ] || continue
            echo "::group::$bundle"
            xcrun xcresulttool get build-results --path "$bundle" --format json \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get("errors", []), indent=2)[:20000] or "no errors recorded")' \
              || echo "could not read $bundle"
            echo "::endgroup::"
          done

  # Previews compile only in the Xcode targets — Package.swift excludes Previews/**,
  # so lint-test can never see them, and a preview that does not compile otherwise
  # first surfaces minutes into a local snapshot run, or after `record` has already
  # deleted every reference. build-for-testing compiles the previews, the generated
  # Prefire tests and the snapshot target; no simulator runtime and no references
  # are involved, which is what makes it runnable on CI's Xcode at all.
  preview-build:
    name: Preview Build (ReachyUISnapshotTests)
    runs-on: xcode-27
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      DEVELOPER_DIR: "/Applications/Xcode_27.0.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/xcode-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile previews and snapshot target
        run: mise run snapshots:build

  # The one job that launches the app binary: XCUITest walks the connect gate on
  # a simulator. Tier 2 (the sim-daemon path) needs the MuJoCo venv and stays local.
  smoke:
    name: Smoke (iOS Simulator)
    runs-on: xcode-27
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      DEVELOPER_DIR: "/Applications/Xcode_27.0.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/xcode-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test
        run: mise run test:smoke
