version: 2

# Tools pinned in mise.toml are NOT covered here — Dependabot has no mise
# ecosystem. They stay a manual bump (see AGENTS.md), and `mise outdated` will
# not surface them either, because exact pins always match their own request.
# Use `./bin/mise latest <tool>`.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      # cliff.toml skips `chore(deps)`, keeping bumps out of the changelog.
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    ignore:
      # Pinned in lockstep with mise.toml and Apps/Project.swift, which Dependabot cannot edit.
      - dependency-name: "github.com/barredewe/prefire"
    groups:
      swift-openapi:
        patterns: ["swift-openapi-*"]
